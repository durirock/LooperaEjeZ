name: Build Loopera APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Instalar NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Descargar LAME
        run: |
          wget -q https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz
          tar -xzf lame-3.100.tar.gz
          cp -r lame-3.100 app/src/main/cpp/lame
      - name: Generar iconos
        run: |
          python3 - <<'EOF'
          import struct, zlib, os
          def png(path, size=72, color=(64,144,232)):
              def chunk(n,d):
                  c=struct.pack('>I',len(d))+n+d
                  return c+struct.pack('>I',zlib.crc32(n+d)&0xffffffff)
              raw=b''.join(b'\x00'+bytes(color)*size for _ in range(size))
              with open(path,'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))
          for d in ['mipmap-hdpi','mipmap-mdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              os.makedirs(f'app/src/main/res/{d}',exist_ok=True)
