name: Build Loopera APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar NDK y CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Descargar LAME
        run: |
          wget -q "https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz"
          tar -xzf lame-3.100.tar.gz
          cp -r lame-3.100 app/src/main/cpp/lame

      - name: Generar iconos y gradlew
        run: |
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p app/src/main/res/$d
            python3 -c "
          import struct,zlib
          def chunk(n,d):
            c=struct.pack('>I',len(d))+n+d
            return c+struct.pack('>I',zlib.crc32(n+d)&0xffffffff)
          raw=b''.join(b'\x00'+bytes([64,144,232])*72 for _ in range(72))
          open('app/src/main/res/$d/ic_launcher.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',72,72,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))
          "
          done
          echo "Iconos generados"
          # Generar gradlew si no existe
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=8.4 || \
            wget -q https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew -O gradlew
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LooperaEjeZ-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
